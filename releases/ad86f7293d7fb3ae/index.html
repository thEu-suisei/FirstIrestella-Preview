// 摘要：用户主动选图，重编码为无 EXIF 的有限 JPEG；不扫描设备相册。
// [/AgentReadme]
(() => {
  let result = '', active = false;
  globalThis.IrestellaImagePicker = {
    take() { const value=result; result=''; return value; },
    open() {
      if(active) return;
      active=true; result='';
      const input=document.createElement('input'); input.type='file'; input.accept='image/jpeg,image/png,image/webp';
      input.style.display='none'; document.body.appendChild(input);
      const finish=value=>{result=JSON.stringify(value);active=false;input.remove();};
      input.addEventListener('cancel',()=>finish({cancelled:true}),{once:true});
      input.addEventListener('change',async()=>{
        let url;
        try {
          const file=input.files[0];
          if(!file) return finish({cancelled:true});
          if(file.size>20*1024*1024) throw Error('图片请小于 20 MB');
          if(!['image/jpeg','image/png','image/webp'].includes(file.type)) throw Error('请选择 JPG、PNG 或 WebP 图片');
          url=URL.createObjectURL(file);
          const image=new Image(); image.src=url; await image.decode();
          if(image.width*image.height>40000000) throw Error('图片分辨率过大');
          const canvas=document.createElement('canvas');
          let size=Math.min(1024,Math.max(image.width,image.height));
          for(let attempt=0;attempt<8;attempt++) {
            const ratio=Math.min(1,size/Math.max(image.width,image.height));
            canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));
            const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
            const data=canvas.toDataURL('image/jpeg',0.72).split(',')[1];
            if(data.length<=64000) return finish({data,width:canvas.width,height:canvas.height});
            size*=0.75;
          }
          throw Error('图片压缩失败，请选择较小图片');
        } catch(error) {finish({error:error.message||'无法读取图片'});}
        finally {if(url) URL.revokeObjectURL(url);}

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));

		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

					statusProgress.max = total;

					statusProgress.removeAttribute('max');
