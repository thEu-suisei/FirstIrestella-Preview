<!--
[AgentReadme]
摘要：在进入 Godot Web 页面前完成离线缓存初始化。
职责：在进入 Godot 页面前完成 Service Worker 注册与页面控制权交接。
设计：启动壳与游戏页面分离，避免把缓存初始化逻辑耦合进导出产物。
边界：不加载项目源码、凭据或第三方脚本。
[/AgentReadme]
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202020">
    <title>FirstIrestella</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #202020; color: #f3f3f3; }
        body { display: grid; place-items: center; font: 16px system-ui, sans-serif; }
    </style>
</head>
<body>
    <div>Loading...</div>
    <script>
        const gameUrl = 'game.html';

        async function openGame() {
            if (!('serviceWorker' in navigator)) {
                window.location.replace(gameUrl);
                return;
            }

            const registration = await navigator.serviceWorker.register('index.service.worker.js');
            await navigator.serviceWorker.ready;
            if (navigator.serviceWorker.controller) {
                window.location.replace(gameUrl);
                return;
            }

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.replace(gameUrl);
            }, { once: true });
            registration.active.postMessage('claim');
        }

        openGame().catch(() => window.location.replace(gameUrl));
    </script>
</body>
</html>
