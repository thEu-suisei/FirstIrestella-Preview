<!--
[AgentReadme]
摘要：进入 Godot Web 页面前检查更新并完成离线缓存版本交接。
职责：在进入 Godot 页面前完成 Service Worker 注册与页面控制权交接。
设计：启动壳与游戏页面分离，避免把缓存初始化逻辑耦合进导出产物。
边界：不加载项目源码、凭据或第三方脚本。
[/AgentReadme]
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202020">
    <title>FirstIrestella</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #202020; color: #f3f3f3; }
        body { display: grid; place-items: center; font: 16px system-ui, sans-serif; }
    </style>
</head>
<body>
    <div>正在进入村落…</div>
    <script>
        const gameUrl = 'game.html';

        async function openGame() {
            if (!('serviceWorker' in navigator)) {
                window.location.replace(gameUrl);
                return;
            }

            const registration = await navigator.serviceWorker.register('index.service.worker.js', { updateViaCache: 'none' });
            // Check at the entry page, before a new game session has unsaved work.
            // Claim only; never use Godot's "update" message which reloads other tabs.
            await registration.update();
            if (registration.installing) {
                const installing = registration.installing;
                await new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error('Update timed out')), 20000);
                    const changed = () => {
                        if (installing.state === 'installed' || installing.state === 'activated') {
                            clearTimeout(timer);
                            installing.removeEventListener('statechange', changed);
                            resolve();
                        } else if (installing.state === 'redundant') {
                            clearTimeout(timer);
                            reject(new Error('Update unavailable'));
                        }
                    };
                    installing.addEventListener('statechange', changed);
                    changed();
                });
            }
            await navigator.serviceWorker.ready;
            const worker = registration.waiting || registration.active;
            if (!worker || navigator.serviceWorker.controller === worker) {
                window.location.replace(gameUrl);
                return;
            }

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.replace(gameUrl);
            }, { once: true });
            worker.postMessage('claim');
        }

        openGame().catch(() => window.location.replace(gameUrl));
    </script>
</body>
</html>
