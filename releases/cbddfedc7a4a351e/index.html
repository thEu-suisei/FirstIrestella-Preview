<!DOCTYPE html>
<html lang="en">
	<head><script>// [AgentReadme]
// 摘要：在 Web 引擎启动前捕获 JS/WASM 错误，按批次持久化并在确认后删除。
// 边界：不采集页面 URL、身份数据和设备文件；不能截获浏览器进程强杀或原生转储。
// [/AgentReadme]
(() => {
  'use strict';
  const config = {"endpoint":"https://irestella-logs.irst-restella.workers.dev","version":"cbddfedc7a4a351e"};
  const prefix = 'irestella-crash-v1:';
  const session = crypto.randomUUID().replaceAll('-', '');
  let sequence = 0, busy = false, captured = 0;
  const memory = new Map();
  const clean = value => String(value ?? '').replace(/https?:\/\/[^\s)]+/g, '[url]')
    .replace(/Bearer\s+[^\s"']+/gi, 'Bearer [REDACTED]')
    .replace(/((?:access_token|client_secret|password|api_key|token)\s*[=:]\s*)[^\s&,"']+/gi, '$1[REDACTED]').slice(0, 8000);
  function remember(batch) {
    memory.set(prefix + batch.batch_id, batch);
    try { localStorage.setItem(prefix + batch.batch_id, JSON.stringify(batch)); } catch { /* Best effort in restricted storage. */ }
  }
  function pending() {
    const batches = new Map(memory);
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key?.startsWith(prefix)) continue;
        try {
          const batch = JSON.parse(localStorage.getItem(key));
          if (batch?.protocol === 1 && batch.events?.length === 1 && key === prefix + batch.batch_id) batches.set(key, batch);
        } catch { /* A corrupt entry cannot block other reports. */ }
      }
    } catch { /* Storage may be unavailable. */ }
    return batches;
  }
  async function flush() {
    if (busy) return;
    busy = true;
    try {
      for (const [key, batch] of pending()) {
        const response = await fetch(config.endpoint + '/v1/logs', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(batch), credentials: 'omit', signal: AbortSignal.timeout(10000)
        });
        const ack = await response.json();
        if (!response.ok || ack.ack !== batch.batch_id || ack.accepted !== batch.events.length) break;
        memory.delete(key);
        try { localStorage.removeItem(key); } catch { /* Duplicate retry is idempotent. */ }
      }
    } catch { /* Failed batches remain for online/next-load retry. */ }
    finally { busy = false; }
  }
  function capture(kind, message, stack) {
    // Bound persistent storage and report storms; existing unsent reports are never evicted.
    if (captured >= 8 || pending().size >= 32) return;
    captured++;
    const id = crypto.randomUUID().replaceAll('-', '');
    remember({protocol: 1, batch_id: id, events: [{session_id: session, seq: ++sequence,
      client_time: new Date().toISOString(), kind: 'browser_error', level: 'error',
      build: config.version, platform: 'Web', data: {category: 'performance_tools',
        error_kind: kind, message: clean(message), stack: clean(stack), source: 'web_bootstrap'}}]});
    void flush();
  }
  globalThis.IrestellaReportCrash = capture;
  addEventListener('error', event => capture('error', event.message || 'Resource load failed', event.error?.stack), true);
  addEventListener('unhandledrejection', event => capture('unhandledrejection', event.reason?.message || event.reason, event.reason?.stack));
  addEventListener('online', () => void flush());
  setInterval(() => void flush(), 30000);
  void flush();
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":7842716,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) { globalThis.IrestellaReportCrash("engine_start", err?.message || err, err?.stack);
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
