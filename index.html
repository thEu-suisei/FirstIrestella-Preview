<!--
[AgentReadme]
文件说明：GitHub Pages 手机试玩入口，先激活 Godot Service Worker，再进入游戏页面。
类：
- 无
函数：
- openGame()：注册并激活 Service Worker，获得页面控制权后进入 game.html。
变量：
- gameUrl（string，模块常量）：Godot 游戏页面相对地址。
- registration（ServiceWorkerRegistration，局部变量）：当前站点的 Service Worker 注册信息。
维护规则：入口只负责缓存初始化和跳转；不得加载项目源码、凭据或第三方脚本。
[/AgentReadme]
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202020">
    <title>FirstIrestella</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #202020; color: #f3f3f3; }
        body { display: grid; place-items: center; font: 16px system-ui, sans-serif; }
    </style>
</head>
<body>
    <div>Loading...</div>
    <script>
        const gameUrl = 'game.html';

        async function openGame() {
            if (!('serviceWorker' in navigator)) {
                window.location.replace(gameUrl);
                return;
            }

            const registration = await navigator.serviceWorker.register('index.service.worker.js');
            await navigator.serviceWorker.ready;
            if (navigator.serviceWorker.controller) {
                window.location.replace(gameUrl);
                return;
            }

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.replace(gameUrl);
            }, { once: true });
            registration.active.postMessage('claim');
        }

        openGame().catch(() => window.location.replace(gameUrl));
    </script>
</body>
</html>
